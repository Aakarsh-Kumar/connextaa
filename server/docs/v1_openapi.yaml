openapi: 3.1.0

info:
  title: Connectify API
  version: 1.0.0
  description: |
    Connectify Collaboration Platform API

    Features:
      - Google Authentication
      - User Onboarding
      - Collaborations
      - Membership Requests
      - Group Chat
      - Ratings
      - Notifications

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Auth
  - name: Onboarding
  - name: Users
  - name: Collaborations
  - name: Memberships
  - name: Chat
  - name: Ratings
  - name: Notifications

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    #################################################
    # COMMON
    #################################################

    ErrorResponse:
      type: object

      required:
        - success
        - message

      properties:
        success:
          type: boolean
          example: false

        message:
          type: string
          example: Unauthorized

    SuccessResponse:
      type: object

      required:
        - success

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operation successful

    PaginationMeta:
      type: object

      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 20

        total:
          type: integer
          example: 145

        hasMore:
          type: boolean
          example: true

    AuthMeResponse:
      type: object

      required:
        - success
        - user

      properties:
        success:
          type: boolean

        user:
          $ref: "#/components/schemas/User"
          
    ProfileResponse:
      type: object

      required:
        - success
        - user
        - stats
        - rating

      properties:
        success:
          type: boolean
          example: true

        user:
          type: object

          required:
            - id
            - name
            - username
            - categories

          properties:
            id:
              type: string
              format: uuid

            name:
              type: string
              example: Rahul Sharma

            username:
              type: string
              example: rahul_23

            avatarUrl:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg

            bio:
              type: string
              nullable: true
              example: Traveller and football enthusiast

            categories:
              type: array

              items:
                $ref: "#/components/schemas/Category"

              example:
                - TRIPS
                - SPORTS
                - EVENTS

        stats:
          type: object

          required:
            - created
            - joined
            - completed

          properties:
            created:
              type: integer
              example: 5

            joined:
              type: integer
              example: 17

            completed:
              type: integer
              example: 10

        rating:
          type: object

          required:
            - overall
            - showUpRating
            - friendlyRating
            - safeRating
            - collaborativeRating
            - totalReviews

          properties:
            overall:
              type: number
              format: float
              example: 3.08
              description: Average of all four rating categories rounded to 2 decimal places

            showUpRating:
              type: number
              format: float
              example: 4.8

            friendlyRating:
              type: number
              format: float
              example: 2.2

            safeRating:
              type: number
              format: float
              example: 1.2

            collaborativeRating:
              type: number
              format: float
              example: 4.1

            totalReviews:
              type: integer
              example: 23

    PendingJoinRequestsResponse:
      type: object
      required:
        - success
        - data

      properties:
        success:
          type: boolean

        data:
          type: array

          items:
            type: object

            properties:
              requestId:
                type: string

              collaboration:
                type: object

                properties:
                  collaborationId:
                    type: string

                  title:
                    type: string

                  category:
                    $ref: "#/components/schemas/Category"

              joinMessage:
                type: string
                nullable: true

              requestedAt:
                type: string
                format: date-time

              status:
                $ref: "#/components/schemas/JoinStatus"

              user:
                type: object

                properties:
                  id:
                    type: string

                  name:
                    type: string

                  username:
                    type: string

                  avatarUrl:
                    type: string
                    nullable: true

    #################################################
    # ENUMS
    #################################################

    Category:
      type: string

      enum:
        - CARPOOLING
        - EVENTS
        - STUDY
        - PROFESSIONAL
        - SPORTS
        - TRIPS
        - OTHER

    CollaborationStatus:
      type: string

      enum:
        - OPEN
        - FULL
        - COMPLETED
        - CANCELLED

    JoinStatus:
      type: string

      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - LEFT

    #################################################
    # USER
    #################################################

    User:
      required:
        - id
        - email
        - name
        - onboardingCompleted
        - username

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string

        email:
          type: string
          
        onboardingCompleted:
          type: boolean

        username:
          type: string

        avatarUrl:
          type: string
          nullable: true

        bio:
          type: string
          nullable: true

    UserStats:
      type: object

      properties:
        created:
          type: integer

        joined:
          type: integer

        completed:
          type: integer

    #################################################
    # LOCATION
    #################################################

    Location:
      type: object

      required:
        - name
        - lat
        - lng

      properties:
        name:
          type: string
          maxLength: 100
          minLength: 3

        lat:
          type: number
          minimum: -90
          maximum: 90

        lng:
          type: number
          minimum: -180
          maximum: 180

    #################################################
    # COLLABORATION
    #################################################

    Collaboration:
      type: object
      required:
        - id
        - title
        - description
        - fromLocation
        - toLocation
        - scheduledAt
        - maxMembers
        - status
        - creator
        - category
      properties:
        id:
          type: string

        category:
          $ref: "#/components/schemas/Category"

        title:
          type: string
          minLength: 3
          maxLength: 40

        description:
          type: string
          minLength: 10
          maxLength: 250

        fromLocation:
          $ref: "#/components/schemas/Location"

        toLocation:
          $ref: "#/components/schemas/Location"

        scheduledAt:
          type: string
          format: date-time

        maxMembers:
          type: integer
          minLength: 2
          maxLength: 30

        status:
          $ref: "#/components/schemas/CollaborationStatus"

        creator:
          $ref: "#/components/schemas/User"          

    CollaborationFeedItem:
      type: object
      
      required:
        - id
        - category
        - title
        - description
        - scheduledAt
        - status
        - currentMembers
        - maxMembers
        - creator
        - rating
        - distanceMeters
        - fromLocation
        - toLocation

      properties:
        id:
          type: string

        category:
          $ref: "#/components/schemas/Category"

        title:
          type: string

        description:
          type: string

        scheduledAt:
          type: string
          format: date-time

        status:
          $ref: "#/components/schemas/CollaborationStatus"

        currentMembers:
          type: integer

        maxMembers:
          type: integer

        distanceMeters:
          type: number
          nullable: true
        
        rating: 
          type: integer
          nullable: true

        creator:
          $ref: "#/components/schemas/User"

        fromLocation:
          $ref: "#/components/schemas/Location"

        toLocation:
          $ref: "#/components/schemas/Location"

    #################################################
    # CHAT
    #################################################

    ChatRoom:
      type: object

      required:
        - roomId
        - collaboration
        - unreadCount
        - memberCount

      properties:
        roomId:
          type: string

        collaboration:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            category:
              $ref: "#/components/schemas/Category"
            scheduledAt:
              type: string
              format: date-time

        unreadCount:
          type: integer

        lastMessage:
          type: string
        
        memberCount:
          type: integer   

        lastMessageSenderName:
          type: string

    Message:
      type: object

      properties:
        id:
          type: string

        message:
          type: string

        createdAt:
          type: string
          format: date-time

        sender:
          $ref: "#/components/schemas/User"

    #################################################
    # NOTIFICATION
    #################################################

    Notification:
      type: object

      properties:
        id:
          type: string

        type:
          type: string

        title:
          type: string

        body:
          type: string

        isRead:
          type: boolean

        createdAt:
          type: string
          format: date-time

    #################################################
    # REQUEST DTOs
    #################################################

    GoogleAuthRequest:
      type: object

      required:
        - idToken

      properties:
        idToken:
          type: string

    OnboardingRequest:
      type: object

      required:
        - username
        - categories

      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20

        bio:
          type: string
          maxLength: 160

        categories:
          type: array

          items:
            $ref: "#/components/schemas/Category"

    UpdateProfileRequest:
      type: object

      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20

        bio:
          type: string
          maxLength: 160

        categories:
          type: array

          items:
            $ref: "#/components/schemas/Category"

    CreateCollaborationRequest:
      type: object

      required:
        - category
        - title
        - description
        - fromLocation
        - toLocation
        - scheduledAt
        - maxMembers

      properties:
        category:
          $ref: "#/components/schemas/Category"

        title:
          type: string

        description:
          type: string

        fromLocation:
          $ref: "#/components/schemas/Location"

        toLocation:
          $ref: "#/components/schemas/Location"

        scheduledAt:
          type: string
          format: date-time

        maxMembers:
          type: integer
          minimum: 2

    UpdateCollaborationRequest:
      type: object

      properties:
        title:
          type: string

        description:
          type: string

        scheduledAt:
          type: string
          format: date-time

        maxMembers:
          type: integer

    JoinRequest:
      type: object

      properties:
        message:
          type: string
          maxLength: 300
          example: Interested in joining

    SendMessageRequest:
      type: object

      required:
        - message

      properties:
        message:
          type: string

    SubmitRatingRequest:
      type: object

      required:
        - collaborationId
        - reviewedUserId
        - showUpRating
        - friendlyRating
        - safeRating
        - collaborativeRating

      properties:
        collaborationId:
          type: string

        reviewedUserId:
          type: string

        showUpRating:
          type: integer
          minimum: 1
          maximum: 5

        friendlyRating:
          type: integer
          minimum: 1
          maximum: 5

        safeRating:
          type: integer
          minimum: 1
          maximum: 5

        collaborativeRating:
          type: integer
          minimum: 1
          maximum: 5

        comment:
          type: string

    #################################################
    # RESPONSE DTOs
    #################################################

    AuthResponse:
      type: object

      required:
        - success
        - user

      properties:
        success:
          type: boolean

        user:
          $ref: "#/components/schemas/User"

    UserProfileResponse:
      type: object

      required:
        - success
        - user
        - stats

      properties:
        success:
          type: boolean

        user:
          $ref: "#/components/schemas/User"

        stats:
          $ref: "#/components/schemas/UserStats"

    CreateCollaborationResponse:
      type: object

      properties:
        success:
          type: boolean

        collaborationId:
          type: string
          format: uuid

        chatRoomId:
          type: string

    CollaborationResponse:
      type: object

      properties:
        success:
          type: boolean

        collaboration:
          $ref: "#/components/schemas/Collaboration"

        members:
          type: array

          items:
            type: object

            properties:
              id:
                type: string

              name:
                type: string

              username:
                type: string

              avatarUrl:
                type: string
                nullable: true

        currentMembers:
          type: integer

        isCreator:
          type: boolean

        myJoinStatus:
          $ref: "#/components/schemas/JoinStatus"

    CollaborationFeedResponse:
      type: object

      properties:
        success:
          type: boolean

        data:
          type: array

          items:
            $ref: "#/components/schemas/CollaborationFeedItem"

        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    ChatRoomsResponse:
      type: object

      properties:
        success:
          type: boolean

        data:
          type: array

          items:
            $ref: "#/components/schemas/ChatRoom"

    MessagesResponse:
      type: object

      properties:
        success:
          type: boolean

        data:
          type: array

          items:
            $ref: "#/components/schemas/Message"

    NotificationsResponse:
      type: object

      properties:
        success:
          type: boolean

        data:
          type: array

          items:
            $ref: "#/components/schemas/Notification"

paths:
  #################################################
  # AUTH
  #################################################

  /auth/google:
    post:
      tags:
        - Auth

      summary: Google Sign In

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"

      responses:
        "200":
          description: Login Success

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

        "400":
          description: Invalid Google Token

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags:
        - Auth

      summary: Current Authenticated User

      responses:
        "200":
          description: Current User

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth

      summary: Logout User

      responses:
        "200":
          description: Logout Success

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  #################################################
  # ONBOARDING
  #################################################

  /onboarding:
    post:
      tags:
        - Onboarding

      summary: Complete Onboarding

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"

      responses:
        "200":
          description: Onboarding Completed

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "400":
          description: Validation Error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #################################################
  # USERS
  #################################################

  /users/me:
    get:
      tags:
        - Users

      summary: Get My Profile

      responses:
        "200":
          description: My Profile

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users

      summary: Update My Profile

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"

      responses:
        "200":
          description: Updated Profile

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

        "400":
          description: Validation Error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}:
    get:
      tags:
        - Users

      summary: Public User Profile

      parameters:
        - name: username

          in: path

          required: true

          schema:
            type: string

      responses:
        "200":
          description: Public Profile

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

        "404":
          description: User Not Found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #################################################
  # COLLABORATIONS
  #################################################

  /collaborations:
    get:
      tags:
        - Collaborations

      summary: Get Collaboration Feed

      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 20

        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/Category"

        - name: lat
          in: query
          schema:
            type: number

        - name: lng
          in: query
          schema:
            type: number

        - name: radius
          in: query
          schema:
            type: number
            default: 10

      responses:
        "200":
          description: Collaboration Feed

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationFeedResponse"

    post:
      tags:
        - Collaborations

      summary: Create Collaboration

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaborationRequest"

      responses:
        "201":
          description: Collaboration Created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollaborationResponse"

        "400":
          description: Validation Error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collaborations/{id}:
    get:
      tags:
        - Collaborations

      summary: Get Collaboration Details

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Collaboration Details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationResponse"

        "404":
          description: Collaboration Not Found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Collaborations

      summary: Update Collaboration

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollaborationRequest"

      responses:
        "200":
          description: Updated Successfully

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationResponse"

        "403":
          description: Only Creator Can Update

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Collaborations

      summary: Delete Collaboration

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Deleted Successfully

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /collaborations/{id}/join:
    post:
      tags:
        - Memberships

      summary: Request To Join Collaboration

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      requestBody:
        required: false

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"

      responses:
        "200":
          description: Join Request Submitted

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /collaborations/{id}/requests:
    get:
      tags:
        - Memberships

      summary: Get Pending Join Requests

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Pending Requests

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean

                  data:
                    type: array

                    items:
                      type: object

                      properties:
                        requestId:
                          type: string

                        joinMessage:
                          type: string

                        status:
                          $ref: "#/components/schemas/JoinStatus"

                        user:
                          $ref: "#/components/schemas/User"

  /collaborations/requests:
    get:
      tags:
        - Memberships

      summary: Get Pending Join Requests for current user

      responses:
        "200":
          description: Pending Requests

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingJoinRequestsResponse"

  /collaborations/requests/{requestId}/approve:
    post:
      tags:
        - Memberships

      summary: Approve Join Request

      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Request Approved

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /collaborations/requests/{requestId}/reject:
    post:
      tags:
        - Memberships

      summary: Reject Join Request

      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Request Rejected

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /collaborations/{id}/leave:
    post:
      tags:
        - Memberships

      summary: Leave Collaboration

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Left Collaboration

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  #################################################
  # CHAT
  #################################################

  /chat/rooms:
    get:
      tags:
        - Chat

      summary: Get User Chat Rooms

      responses:
        "200":
          description: Chat Rooms

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoomsResponse"

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}/messages:
    get:
      tags:
        - Chat

      summary: Get Room Messages

      parameters:
        - name: roomId

          in: path

          required: true

          schema:
            type: string
            format: uuid

        - name: page

          in: query

          schema:
            type: integer
            default: 1

        - name: limit

          in: query

          schema:
            type: integer
            default: 50

      responses:
        "200":
          description: Messages

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"

    post:
      tags:
        - Chat

      summary: Send Message

      parameters:
        - name: roomId

          in: path

          required: true

          schema:
            type: string
            format: uuid

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"

      responses:
        "201":
          description: Message Sent

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  #################################################
  # RATINGS
  #################################################

  /ratings:
    post:
      tags:
        - Ratings

      summary: Submit User Rating

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRatingRequest"

      responses:
        "201":
          description: Rating Submitted

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "400":
          description: Invalid Rating

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Cannot Rate User

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

